# Redmine 7 + PostgreSQL 17 with this plugin and companions (see Dockerfile).
#   docker compose -f docker/deploy/compose.yml up -d --build
# Then open http://127.0.0.1:3000 (admin / admin on first login).
# Change the passwords and SECRET_KEY_BASE before using it beyond a trial.
name: redmine_gantrix_deploy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redmine}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redmine:
    build:
      context: ../..
      dockerfile: docker/deploy/Dockerfile
    image: redmine-gantrix:7.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD:-redmine}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-change-me-0123456789abcdef}
      # Webhook secrets for redmine_merge_request_links; set the ones you use.
      REDMINE_MERGE_REQUEST_LINKS_GITHUB_WEBHOOK_TOKEN: ${REDMINE_MERGE_REQUEST_LINKS_GITHUB_WEBHOOK_TOKEN:-}
      REDMINE_MERGE_REQUEST_LINKS_GITLAB_WEBHOOK_TOKEN: ${REDMINE_MERGE_REQUEST_LINKS_GITLAB_WEBHOOK_TOKEN:-}
      REDMINE_MERGE_REQUEST_LINKS_GITEA_WEBHOOK_TOKEN: ${REDMINE_MERGE_REQUEST_LINKS_GITEA_WEBHOOK_TOKEN:-}
      REDMINE_MERGE_REQUEST_LINKS_CODECOMMIT_WEBHOOK_TOKEN: ${REDMINE_MERGE_REQUEST_LINKS_CODECOMMIT_WEBHOOK_TOKEN:-}
    ports:
      - "127.0.0.1:${REDMINE_PORT:-3000}:3000"
    volumes:
      - redmine-files:/usr/src/redmine/files
    restart: unless-stopped

volumes:
  db-data:
  redmine-files:
